name: Validar dados

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # acervo/ guarda texto integral das fontes (uso interno; ver acervo/LEIAME.md):
      # com o repositório público, nenhum PDF/texto de acervo/ pode estar versionado.
      - name: Acervo só em repositório privado
        env:
          REPO_PRIVADO: ${{ github.event.repository.private }}
        run: |
          n=$(git ls-files acervo/pdf acervo/txt | grep -vc '/\.gitkeep$' || true)
          echo "Arquivos de texto integral versionados em acervo/: $n (repositório privado: ${REPO_PRIVADO:-?})"
          if [ "$n" -gt 0 ] && [ "$REPO_PRIVADO" != "true" ]; then
            echo "::error title=Acervo em repositório público::O repositório está PÚBLICO e há $n arquivo(s) de texto integral das fontes em acervo/pdf ou acervo/txt. Essas cópias são de uso interno, com direitos de autores e editoras, e não podem ficar num repositório público nem ser publicadas. Torne o repositório privado ou retire o conteúdo de acervo/ (inclusive do histórico). Ver acervo/LEIAME.md."
            git ls-files acervo/pdf acervo/txt | head -20
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Fontes
        run: python3 scripts/validar_fontes.py
      - name: Fichamento e revisões (histórico das revisões contra o commit anterior ao push/PR)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="HEAD~1"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="HEAD"
          python3 scripts/validar_fichamento.py --base "$BASE"
      - name: Testes da revisão (fixtures sintéticas)
        run: python3 -m unittest discover -s tests -v
      - name: Fichas, grafo, entidades, lista-mestra, itãs e tradições (inclui checar se estão em dia com o fichamento)
        run: python3 scripts/validar_fichas.py
      - name: Divergências em dia
        run: |
          python3 scripts/divergencias.py
          git diff --exit-code data/fichamento/divergencias.json
      - name: Capítulos narrativos (referências, lacunas, heurística, divergências, Candomblé × Umbanda, JSON em dia)
        run: python3 scripts/validar_capitulos.py
      - name: Anti-cópia
        run: python3 scripts/anticopia.py

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build do site (Astro + Pagefind)
        run: npm run build
      - name: QA do site (versões x data/orixas, pré-fichamento/retidos, selo, revisão, links e âncoras, downloads)
        run: python3 ../scripts/qa_site.py
      - name: Revisão ponta a ponta (dados sintéticos numa cópia temporária → build → QA)
        run: python3 ../tests/e2e_revisao_site.py
      - name: Modelo 2 ponta a ponta (lista-mestra, ficha de entidade nova, itãs, cosmologia)
        run: python3 ../tests/e2e_modelo2_site.py
      - name: Capítulos ponta a ponta (aviso de entidade sensível, panorama da cosmologia)
        run: python3 ../tests/e2e_capitulos_site.py
